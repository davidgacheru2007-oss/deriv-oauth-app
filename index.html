    <script>
        // Your exact text and letter App ID from your dashboard:
        const APP_ID = '34IJSk4c0LF1i7kRla4s9'; 

        // Automatically captures your Vercel link
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        // Triggers the login sequence
        document.getElementById('loginBtn').addEventListener('click', () => {
            // Clean link formula to handle mixed text/number App IDs flawlessly
            const oauthUrl = "https://deriv.com" + APP_ID + "&l=en";
            window.location.href = oauthUrl;
        });

        // Processes URL values returned by Deriv after a successful login
        function checkOAuthResponse() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('acct1')) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('userProfile').style.display = 'block';
                
                document.getElementById('accId').innerText = urlParams.get('acct1');
                document.getElementById('currency').innerText = urlParams.get('cur1').toUpperCase();
                document.getElementById('token').innerText = urlParams.get('token1');
            }
        }

        window.onload = checkOAuthResponse;
                    </script>
